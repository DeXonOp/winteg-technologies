# ═══════════════════════════════════════════════════════════
#  Winteg Technologies — Production Nginx Configuration
#  Optimized for Ubuntu 22.04 VPS (Hostinger KVM 2)
#  - Static frontend serving with aggressive caching
#  - Video streaming with byte-range support
#  - Reverse proxy to FastAPI/Uvicorn backend
#  - Gzip + Brotli compression
#  - SSL/TLS via Let's Encrypt (Certbot)
# ═══════════════════════════════════════════════════════════

# ── Worker config (auto-detect CPU cores) ──────────────────
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance tuning ─────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_max_body_size 50M;

    # ── Logging (reduced for performance) ──────────────────
    access_log /var/log/nginx/access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip Compression ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Rate Limiting (prevents abuse) ────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ── HTTP → HTTPS redirect ─────────────────────────────
    server {
        listen 80;
        server_name wintegtechnologies.com www.wintegtechnologies.com;
        return 301 https://wintegtechnologies.com$request_uri;
    }

    # ── www → non-www redirect ────────────────────────────
    server {
        listen 443 ssl http2;
        server_name www.wintegtechnologies.com;

        ssl_certificate     /etc/letsencrypt/live/wintegtechnologies.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wintegtechnologies.com/privkey.pem;

        return 301 https://wintegtechnologies.com$request_uri;
    }

    # ═════════════════════════════════════════════════════
    #  MAIN SERVER BLOCK
    # ═════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name wintegtechnologies.com;

        # ── SSL Configuration ─────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/wintegtechnologies.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wintegtechnologies.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security Headers ──────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Frontend: Static files from Vite build ────────
        root /var/www/winteg/client/dist;
        index index.html;

        # ── VIDEO FILES — Elite streaming with byte-range ─
        location ~* \.(mp4|webm|ogg)$ {
            root /var/www/winteg/client/dist;

            # Enable byte-range requests for instant video seeking
            add_header Accept-Ranges bytes;

            # Cache videos for 1 year (immutable — filename hash changes on rebuild)
            add_header Cache-Control "public, max-age=31536000, immutable";

            # Allow cross-origin for video loading
            add_header Access-Control-Allow-Origin "*";

            # Disable buffering for instant streaming
            proxy_buffering off;

            # Increase buffer for large video files
            sendfile on;
            tcp_nopush on;
            aio on;
            directio 512;
            output_buffers 1 2m;
        }

        # ── STATIC ASSETS — JS, CSS, Images, Fonts ───────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            root /var/www/winteg/client/dist;

            # Cache for 1 year with immutable (Vite adds content hash to filenames)
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ── API PROXY → FastAPI Backend ───────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep-alive to backend
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            # Don't buffer API responses
            proxy_buffering off;
        }

        # ── WebSocket support (for live visitors, chat) ───
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ── SPA Fallback — serve index.html for all routes ─
        location / {
            try_files $uri $uri/ /index.html;

            # HTML should not be cached (so new deployments take effect instantly)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }

    # ═════════════════════════════════════════════════════
    #  API-ONLY SERVER BLOCK (api.wintegtechnologies.com)
    # ═════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name api.wintegtechnologies.com;

        ssl_certificate     /etc/letsencrypt/live/wintegtechnologies.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wintegtechnologies.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
    }
}
